<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/aihealth-mark.png" />
    <link rel="apple-touch-icon" href="/aihealth-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <!-- JetBrains Mono — HUD / measurement readouts (typography audit #29) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <title>aiHealth Imaging</title>
    <meta name="description" content="aiHealth Imaging — DICOM, CBCT, and intra-oral scan viewer." />

    <!-- Social share (aiHealth mark) -->
    <meta property="og:title" content="aiHealth Imaging" />
    <meta property="og:description" content="aiHealth Imaging — DICOM, CBCT, and intra-oral scan viewer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://imaging.aihealth.app/" />
    <meta property="og:image" content="https://imaging.aihealth.app/aihealth-mark.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://imaging.aihealth.app/aihealth-mark.png" />

    <!--
      coi-serviceworker enables crossOriginIsolated (and therefore
      SharedArrayBuffer) by injecting COOP/COEP/CORP response headers
      via a service worker. Required by Cornerstone3D's streaming-image
      volume loader for CBCT / CT volume rendering.

      Belt + suspenders: vercel.json also sets the headers at the CDN
      level. The SW guarantees they're applied even when the CDN cache
      is stale or the browser doesn't honour `credentialless`.
    -->
    <script src="/coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
