<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/aihealth-mark.png" />
    <link rel="apple-touch-icon" href="/aihealth-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No third-party font CDNs: patient-facing pages must not call out to
         outside hosts. Inter / JetBrains Mono are used when installed
         locally, otherwise the system UI / monospace stacks (index.css,
         tailwind.config.js). -->
    <title>Kyour.ai Imaging Interpreter</title>
    <meta name="description" content="Kyour.ai Imaging Interpreter — view your scan invitation." />

    <!-- Social share (aiHealth mark). og:url / og:image / twitter:image are
         injected at build time from VITE_PUBLIC_VIEWER_URL (vite.config.js)
         and omitted when it is unset. -->
    <meta property="og:title" content="Kyour.ai Imaging Interpreter" />
    <meta property="og:description" content="View your scan invitation with Kyour.ai Imaging Interpreter." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!--
      coi-serviceworker enables crossOriginIsolated (and therefore
      SharedArrayBuffer) by injecting COOP/COEP/CORP response headers
      via a service worker. Required by Cornerstone3D's streaming-image
      volume loader for CBCT / CT volume rendering.

      Belt + suspenders: vercel.json also sets the headers at the CDN
      level. The SW guarantees they're applied even when the CDN cache
      is stale or the browser doesn't honour `credentialless`.
    -->
    <script src="/coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
